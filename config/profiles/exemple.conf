# profil exemple - a copier/editer (profile SAVE est plus pratique)
# Active avec : profile SWITCH exemple
#
# Seules les cles listees ici surchargent device.conf.
# Format identique : CLE=valeur (cles connues de conf_check).

# exemple : variante reseau secondaire
#IP=192.168.50.21

# exemple : variante memoire agressive
#MEM_SWAPPINESS=60
#LOGD_SIZE_KB=128

# exemple : SSH en mot de passe temporaire
#SSH_MODE=password
