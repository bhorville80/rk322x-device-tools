DEVICE_ID=RK322X_MXQ
DEVICE_NAME=Leelbox
PROFILE=
RAM_MB=2048
NETWORK=static
INTERFACE=eth0
ADB_PORT=5555
DEPLOY_VERSION=17

# --- reseau cible ---
PREFIX=24
NETMASK=255.255.255.0
IP=192.168.50.20
GATEWAY=192.168.50.1
DNS=8.8.8.8

# --- materiel (reference, detecte par device_info) ---
HW_PLATFORM=rk322x
HW_BOARD=rk30board
HW_ANDROID=7.1.2
HW_SDK=25
HW_ABI=armeabi-v7a
HW_PATCH=2017-04-05
HW_BUILD=NV6.20181031

# Services init arretes par field_mode (noms init.rc, separes par espaces)
# Exemple : SERVICES_STOP=bootanim
SERVICES_STOP=

# --- cut_services (allegement V3) ---
# SERVICES_CUT          remplace la liste services SAFE par defaut
# SERVICES_CUT_KEEP     exclut des services de la liste effective
# PACKAGES_DISABLE      ajoute des paquets a desactiver (ex: com.google.android.gms)
# PACKAGES_DISABLE_KEEP exclut des paquets de la liste SAFE
SERVICES_CUT=
SERVICES_CUT_KEEP=
PACKAGES_DISABLE=
PACKAGES_DISABLE_KEEP=

# --- ssh (serveur dropbear, binaire non fourni) ---
# SSH_PORT=2222
# SSH_MODE=keys|password|any   (keys conseille)
# SSH_BIN=                     chemin du binaire dropbear si hors emplacements standards
# SSH_PASSWORD                 NE PAS RENSEIGNER ICI -> config/secrets.conf
SSH_PORT=2222
SSH_MODE=keys
SSH_BIN=

# --- memoire (mem_tune OPTIMIZE) ---
# MEM_ZRAM_MB=512    swap compresse en RAM (0 = ne rien faire ; depend du kernel)
# MEM_SWAPPINESS=100 tendance au swap avec zram (defaut Linux : 60)
#                    NOTE : sans effet tant qu'aucun swap n'existe
#                    avec un swap DISQUE actif, preferer 20-40
# MEM_LMK_EARLY=1    minfree x1.4 -> kills plus tot sous pression memoire
# LOGD_SIZE_KB=256   taille buffers logcat (usure eMMC ; 0 = defaut firmware)
# Retour recette v5 : kernel Leelbox sans backend compression (lz4 casse,
# cf. TROUBLESHOOTING) -> zram desactive ici, LMK early active (24/7).
MEM_ZRAM_MB=0
MEM_SWAPPINESS=100
MEM_LMK_EARLY=1
LOGD_SIZE_KB=256

# --- swap disque optionnel (alternative au zram impossible sur ce kernel) ---
# Desactive par defaut : a activer en connaissance de cause (usure flash).
# MEM_SWAP_DEV       partition brute type 82 ex /dev/block/mmcblk1p1 (SD)
# MEM_SWAP_FILE      fichier swap sur la cle ex /mnt/media_rw/<ID>/swap.bin
# MEM_SWAP_MB        taille du fichier (cree au premier OPTIMIZE, defaut 512)
# Priorite 1 (sous le zram prio 10). Ne survit pas au reboot :
# relance par BOOT_MEM_TUNE=1. Avec swap disque -> MEM_SWAPPINESS=20-40.
#MEM_SWAP_DEV=
#MEM_SWAP_FILE=
#MEM_SWAP_MB=512

# --- allègement actif (cut_services CUT applique ces paquets en plus) ---
# Activé le 2026-08-23 : box headless sans apps Google/Play.
# Gain mesuré sur cette box : ~85 Mo PSS (gms), ~20 Mo (mediacenter),
# ~17 Mo (launcher Swelb), ~14 Mo (vending).
# Pour garder un paquet : le retirer de la liste puis relancer
# cut_services CUT ; retour arrière complet : cut_services RESTORE.
PACKAGES_DISABLE=com.google.android.gms com.google.android.gms.persistent com.rockchips.mediacenter com.android.vending com.Swelb.zonglaunher com.cetusplay.remoteservice org.xbmc.kodi com.netflix.mediaclient com.google.android.youtube.tv

# --- wireless ---
# WIRELESS_AIRPLANE=1 : disable_wireless OFF active aussi le mode avion
WIRELESS_AIRPLANE=0

# --- demarrage automatique (boot INSTALL pose le hook init) ---
# BOOT_MEM_TUNE=1      mem_tune OPTIMIZE a chaque boot
# BOOT_CUT_SERVICES=1  cut_services CUT a chaque boot
# BOOT_SET_NETWORK=1   set_network a chaque boot : route+DNS non persistants
#                      sur ce firmware (sinon passerelle absente apres reboot)
# BOOT_TIME_SYNC=1     set_time AUTO a chaque boot : sort l'horloge de 1970,
#                      FILE (SET_HEURE cle) affine, reseau/TIME_SYNC precise
# BOOT_EXPOSE=1        pile web (8000/8080/8081) des la fin du boot
# BOOT_WAIT_BOOT       attente max fin de boot en secondes (defaut 120)
# BOOT_WAIT_KEY        attente max d'enumeration de la cle apres le boot
#                      (defaut 150 ; la cle peut etre lente sur ce socle)
BOOT_MEM_TUNE=1
BOOT_CUT_SERVICES=1
BOOT_SET_NETWORK=1
BOOT_TIME_SYNC=1
BOOT_EXPOSE=1

# --- carte SD au demarrage (sd_boot ; examinee EN TOUT DERNIER) ---
# BOOT_SD_LAST=1       boot lance sd_boot CHECK apres tout le reste :
#                      une carte lente/problematique ne bloque plus le boot
# SD_MOUNT_RO=1        monter la carte en lecture seule (usure/reliabilite)
# SD_WAIT_SEC          attente max d'enumeration de la carte (defaut 15)
BOOT_SD_LAST=1
SD_MOUNT_RO=1
SD_WAIT_SEC=15

# --- console distante (panneau, page Telecommande) ---
# WEB_RUN=1 : autorise l'API RUN (execution d'une ligne de commande depuis
#             le panneau, sortie bornee 15 s / 8 Ko, chaque ligne loggee).
#             Double securite : ne fonctionne QUE si server/token existe
#             aussi. Defaut 0 = console desactivee.
WEB_RUN=0

# --- telecommande (remote_map ; vide = device IR autodetecte) ---
# Sur cette box : rk29-keypad -> rk29-keypad.kl (cf. remote_map STATUS)
# REMOTE_KL_DEVICE=rk29-keypad
REMOTE_KL_DEVICE=

# --- afficheur frontal 4 digits (front_digit) ---
# FD_FORMAT         trame qui marche sur cette box (PROBE le memorise)
# FD_ROTATE_SEC     intervalle rotation front_digit ROTATE (defaut 5)
# FD_ROTATE_ITEMS   items affiches en rotation : TIME IP RAM UP
# BOOT_FRONT_CLOCK=1 horloge custom au boot via boot INSTALL (remplace FD655_Demo)
FD_FORMAT=
FD_ROTATE_SEC=5
FD_ROTATE_ITEMS=TIME IP
BOOT_FRONT_CLOCK=1
