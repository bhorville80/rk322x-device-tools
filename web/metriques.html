<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RK322X - Metriques</title>

<style>
body { font-family:Arial,sans-serif; background:#111; color:#eee; margin:0; padding:25px; }
.panel { max-width:960px; margin:auto; }
h1 { margin-top:0; } h2 { font-size:18px; color:#9cf; margin-bottom:6px; }
nav a { color:#eee; background:#333; border:1px solid #555; border-radius:6px;
        padding:8px 14px; margin-right:6px; text-decoration:none; font-size:14px; }
nav a.here { background:#9cf; color:#000; border-color:#9cf; }
nav { margin:12px 0 20px; }
button { padding:10px 16px; margin:4px; font-size:14px; cursor:pointer;
         border-radius:6px; border:1px solid #555; background:#333; color:#eee; }
button:hover { background:#444; }
.dim { font-size:12px; color:#888; }
.apistatus { margin:-10px 0 18px; font-size:12px; color:#888; }
.apistatus b { display:inline-block; padding:2px 8px; margin-right:6px;
               border-radius:4px; border:1px solid #444; font-weight:normal; color:#888; }
.apistatus b.up   { color:#7c7; border-color:#3a5a3a; }
.apistatus b.warn { color:#fc6; border-color:#a86; }
.apistatus b.down { color:#e66; border-color:#a55; }

/* onglets */
.tabs { display:flex; flex-wrap:wrap; gap:6px; margin:6px 0 14px; }
.tabs button { min-width:150px; }
.tabs button.on { background:#9cf; color:#000; border-color:#9cf; }

/* carte action : un bouton = sa zone noire */
.actgrid { display:flex; flex-direction:column; gap:14px; }
.card { background:#161616; border:1px solid #2c2c2c; border-radius:8px; padding:10px 12px; }
.head { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
label.act { display:inline-flex; align-items:center; gap:6px; cursor:pointer; font-size:14px; }
.aid { color:#9cf; font-family:monospace; }
.chip { display:inline-block; min-width:64px; text-align:center; font-size:11px;
        border-radius:4px; padding:1px 4px; border:1px solid #444; color:#888; }
.chip.pending { color:#fc6; border-color:#a86; animation:blink 1s infinite; }
.chip.ok      { color:#7c7; border-color:#3a5a3a; }
.chip.ko      { color:#e66; border-color:#a55; }
@keyframes blink { 50% { opacity:.35; } }
.outbox { white-space:pre-wrap; background:#000; margin-top:8px; padding:12px;
          min-height:60px; max-height:320px; overflow:auto; border-radius:8px;
          font-family:monospace; font-size:12px; color:#ddd; }
.bar { display:flex; align-items:center; gap:8px; flex-wrap:wrap;
       border:1px dashed #333; border-radius:8px; padding:10px 12px; margin-bottom:14px; }
select { background:#222; color:#eee; border:1px solid #444; border-radius:4px; padding:4px; }
.footer { margin-top:26px; padding-top:10px; border-top:1px solid #333;
         font-size:11px; color:#666; text-align:center; }
</style>
</head>

<body>

<div class="panel">

<h1>Metriques</h1>

<nav>
  <a href="index.html">Accueil</a>
  <a href="cle.html">Cle</a>
  <a href="commandes.html">Commandes</a>
  <a href="metriques.html" class="here">Metriques</a>
  <a href="telecommande.html">Telecommande</a>
  <a href="infos.html">Infos</a>
</nav>

<div class="apistatus" id="apistatus">ports :
  <b id="as8000">8000 test...</b>
  <b id="as8180">8180 api...</b>
  <b id="as8081">8081 gui...</b>
</div>

<div class="bar">
  <button onclick="launchSelected()">&#9654; LANCER LA SELECTION</button>
  <span class="dim"> max parallele :
  <select id="maxth">
    <option>1</option><option>2</option><option>3</option><option>4</option>
  </select></span>
  <span class="dim">| listeners box :
  <select id="maxconn">
    <option>1</option><option selected>3</option><option>4</option>
    <option>5</option><option>6</option><option>7</option><option>2</option>
  </select>
  <button onclick="saveMaxConn()" style="padding:6px 10px;font-size:12px">APPLIQUER</button></span>
  <span class="dim">| depart decale ; chaque bouton a son rapport ; releves aussi dans log/ sur la cle</span>
</div>

<div class="tabs" id="tabs"></div>
<div class="actgrid" id="grid"></div>

</div>


<div class="footer">panneau IHM v19 - rk322x device tools</div>

<script>

var API = "http://" + location.hostname + ":8180/api/";

function tokUrl(base) {
    var t = "";
    try { t = localStorage.getItem("rk_token") || ""; } catch (e) {}
    if (!t) return base;
    return base + (base.indexOf("?") < 0 ? "?" : "&") + "token=" + encodeURIComponent(t);
}

// box sans tcpsvd : API mono-slot (une seule requete 8180 a la fois) ->
// appels SERIALIZES via une file d'attente + re-essais espaces aleatoires ;
// une rafale au chargement ne doit plus finir en "injoignable"
var apiChain = Promise.resolve();

function apiOnce(path, attempt) {
    var opts = {cache: "no-store"};
    if (typeof AbortController === "function") {
        var ac = new AbortController();
        setTimeout(function () { ac.abort(); }, 20000);
        opts.signal = ac.signal;
    }
    return fetch(tokUrl(API + path), opts).then(function(r) {
        if (r.status === 403) {
            var t = prompt("API protegee par un token (server/token sur la cle).\nEntrer la valeur du token :");
            if (t && t.trim()) {
                try { localStorage.setItem("rk_token", t.trim()); } catch (e) {}
                location.reload();
                throw new Error("token memorise, rechargement...");
            }
            throw new Error("403 forbidden (token requis)");
        }
        return r.text();
    }).catch(function(e) {
        if (e && e.message && e.message.indexOf("403") === 0) throw e;
        if ((attempt || 0) < 2) {
            // delai aleatoire : les re-essais concurrents ne retombent
            // pas tous sur le meme slot libre
            var wait = 500 + Math.floor(Math.random() * 800) + (attempt || 0) * 900;
            return new Promise(function(res) {
                setTimeout(function() { res(apiOnce(path, (attempt || 0) + 1)); }, wait);
            });
        }
        var cause = (e && e.message) ? e.message : "" + e;
        if (e && e.name === "AbortError") cause = "delai de 20 s depasse";
        throw new Error("API 8180 injoignable (" + cause + ") - lancer deploy EXPOSE sur la box");
    });
}

function api(path) {
    var run = function () { return apiOnce(path, 0); };
    var link = apiChain.then(run, run);
    apiChain = link.then(function () {}, function () {});
    return link;
}

/* ---- catalogue : onglets -> actions (un bouton = une zone noire) ---- */

var TABS = [
    { id: "diag",   label: "DIAGNOSTIC",
      acts: ["N5", "N6", "C1", "N8"] },
    { id: "proc",   label: "PROCESSUS / RAM",
      acts: ["N10", "N11"] },
    { id: "swap",   label: "SWAP",
      acts: ["O9", "O11", "O12"] },
    { id: "launch", label: "LAUNCHER TV",
      acts: ["C4"] }
];

var ACTIONS = {
    N5:  { api: "VITALS",     label: "VITALS" },
    N6:  { poll: "/log/state_last.txt", kick: "STATE", label: "CHECK STATE" },
    C1:  { api: "CONF_CHECK_REFRESH", label: "CONF CHECK" },
    N8:  { api: "SYS_INFO",   label: "SYS DIAG" },
    N10: { api: "PROC",       label: "PROCESSUS PSS" },
    N11: { api: "DEV",        label: "CAPACITES DEV" },
    O9:  { api: "PROBE",      label: "PROBE SWAPON" },
    O11: { api: "SWAP",       label: "ETAT MEMOIRE" },
    O12: { api: "SWWATCH",    label: "GARDIEN SWAP" },
    C4:  { api: "LAUNCHER",   label: "LAUNCHER ETAT" }
};

/* ---- construction des onglets et des cartes ---- */

function buildTabs() {
    var tb = document.getElementById("tabs");
    var gr = document.getElementById("grid");
    TABS.forEach(function (t, i) {
        var b = document.createElement("button");
        b.textContent = t.label;
        b.id = "tab-" + t.id;
        b.onclick = function () { showTab(t.id); };
        tb.appendChild(b);

        var pane = document.createElement("div");
        pane.className = "actgrid";
        pane.id = "pane-" + t.id;

        t.acts.forEach(function (id) {
            var a = ACTIONS[id];
            var card = document.createElement("div");
            card.className = "card";
            card.innerHTML =
                '<div class="head">' +
                  '<label class="act"><input type="checkbox" id="cb-' + id + '"' +
                    (i === 0 && (id === "N5" || id === "N6") ? " checked" : "") + '>' +
                    '<span class="aid">[' + id + ']</span> ' + a.label +
                    ' <span class="chip" id="chip-' + id + '"></span></label>' +
                  '<button onclick="runOne(\'' + id + '\')">&#9654; LANCER</button>' +
                  '<span class="dim">rapport dedie ci-dessous</span>' +
                '</div>' +
                '<div class="outbox" id="out-' + id + '">[ -- ] pas encore execute sur cette page.</div>';
            pane.appendChild(card);
        });

        gr.appendChild(pane);
    });
    showTab(TABS[0].id);
}

function showTab(id) {
    TABS.forEach(function (t) {
        document.getElementById("tab-" + t.id).className = (t.id === id ? "on" : "");
        document.getElementById("pane-" + t.id).style.display = (t.id === id ? "" : "none");
    });
}

/* ---- puce d'etat + rapport dedie par action ---- */

function setChip(id, cls, txt) {
    var c = document.getElementById("chip-" + id);
    if (c) { c.className = "chip " + cls; c.textContent = txt; }
}

function stampNow() {
    var d = new Date();
    function p(n) { return (n < 10 ? "0" : "") + n; }
    return p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds());
}

function setOut(id, txt) {
    var box = document.getElementById("out-" + id);
    if (!box) return;
    box.textContent = "[" + stampNow() + "] " + txt;
    box.scrollTop = box.scrollHeight;
}

/* ---- runners individuels ---- */

function runVitals() {
    return api("VITALS");
}

function runState() {
    return new Promise(function (done) {
        var stamp0 = "";
        fetch("/log/state_last.txt", {cache:"no-store"})
            .then(r => r.ok ? r.text() : "")
            .then(t => { stamp0 = t.slice(0, 40); })
            .catch(() => {});
        var tries = 0;
        (function poll() {
            api("STATE").catch(function () {});
            setTimeout(function () {
                fetch("/log/state_last.txt", {cache:"no-store"})
                    .then(r => { if (!r.ok) throw 0; return r.text(); })
                    .then(t => {
                        if (t.slice(0, 40) === stamp0 && tries < 8) {
                            tries++; setTimeout(poll, 2000); return;
                        }
                        done(t);
                    })
                    .catch(() => {
                        if (tries++ < 8) { setTimeout(poll, 2000); }
                        else { done("(etat indisponible)"); }
                    });
            }, tries === 0 ? 1500 : 2000);
        })();
    });
}

function runnerFor(id) {
    var a = ACTIONS[id];
    if (a.poll) return runState;
    return function () { return api(a.api); };
}

function runOne(id) {
    setChip(id, "pending", "EN COURS");
    setOut(id, "execution en cours...");
    runnerFor(id)()
        .then(function (txt) { setOut(id, txt);           setChip(id, "ok", "OK");     })
        .catch(function (e)   { setOut(id, "Erreur : " + e); setChip(id, "ko", "ECHEC"); });
}

/* ---- pool global : selection multi-onglets, max threads respecte ---- */

function getChecked() {
    var ids = [];
    Object.keys(ACTIONS).forEach(function (id) {
        var cb = document.getElementById("cb-" + id);
        if (cb && cb.checked) ids.push(id);
    });
    return ids;
}

function launchSelected() {
    var ids = getChecked();
    if (!ids.length) { alert("cocher au moins une action"); return; }
    var max = parseInt(document.getElementById("maxth").value, 10) || 1;
    var queue = ids.slice(), active = 0;

    ids.forEach(function (id) {
        setChip(id, "pending", "EN COURS");
        setOut(id, "en file (pool max " + max + ")...");
    });

    (function pump() {
        while (active < max && queue.length) {
            (function (id) {
                active++;
                runnerFor(id)()
                    .then(function (txt) { setOut(id, txt);              setChip(id, "ok", "OK");     })
                    .catch(function (e)   { setOut(id, "Erreur : " + e); setChip(id, "ko", "ECHEC"); })
                    .then(function () {
                        active--;
                        setTimeout(pump, 300);   /* depart decale */
                    });
            })(queue.shift());
        }
    })();
}

function saveMaxConn() {
    var v = document.getElementById("maxconn").value;
    api("MAXCONN?v=" + v)
        .then(function (t) { alert("[MAXCONN] " + t); })
        .catch(function (e) { alert("[MAXCONN] Erreur : " + e); });
}

buildTabs();

var AS_TOK = "";
try { AS_TOK = localStorage.getItem("rk_token") || ""; } catch (e) {}
function asUrl(b) {
    if (!AS_TOK) return b;
    return b + (b.indexOf("?") < 0 ? "?" : "&") + "token=" + encodeURIComponent(AS_TOK);
}
function asSet(id, cls, t) {
    var e = document.getElementById(id);
    if (e) { e.className = cls; e.textContent = t; }
}
asSet("as8000", "up", "8000 HTTP OK");
// box mono-slot (sans tcpsvd) : une connexion a la fois sur 8180/8081 ->
// sondes avec re-essais espaces ; un refus transitoire ne s'affiche plus
// immédiatement comme INJOIGNABLE
function probe(url, ok, ko, n) {
    n = n || 0;
    fetch(asUrl(url), {cache:"no-store"}).then(ok).catch(function () {
        if (n < 2) {
            setTimeout(function () { probe(url, ok, ko, n + 1); },
                       600 + Math.floor(Math.random() * 900));
            return;
        }
        ko();
    });
}
probe("http://" + location.hostname + ":8180/api/HELP", function (r) {
    asSet("as8180", r.status === 403 ? "warn" : "up",
          r.status === 403 ? "8180 API UP - token requis" : "8180 API OK");
}, function () {
    asSet("as8180", "down", "8180 API INJOIGNABLE (arrete ou bloque)");
});
probe("http://" + location.hostname + ":8081/", function (r) {
    asSet("as8081", r.status === 403 ? "warn" : "up",
          r.status === 403 ? "8081 GUI UP - token requis" : "8081 GUI OK");
}, function () {
    asSet("as8081", "down", "8081 GUI INJOIGNABLE (arrete ou bloque)");
});

</script>

</body>
</html>
