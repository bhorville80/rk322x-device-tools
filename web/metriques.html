<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RK322X - Metriques</title>

<style>
body { font-family:Arial,sans-serif; background:#111; color:#eee; margin:0; padding:25px; }
.panel { max-width:860px; margin:auto; }
h1 { margin-top:0; } h2 { font-size:18px; color:#9cf; margin-bottom:6px; }
nav a { color:#eee; background:#333; border:1px solid #555; border-radius:6px;
        padding:8px 14px; margin-right:6px; text-decoration:none; font-size:14px; }
nav a.here { background:#9cf; color:#000; border-color:#9cf; }
nav { margin:12px 0 20px; }
button { padding:12px 18px; margin:4px; font-size:15px; cursor:pointer;
         border-radius:6px; border:1px solid #555; background:#333; color:#eee; }
button:hover { background:#444; }
#out { white-space:pre-wrap; background:#000; padding:15px; min-height:160px;
       max-height:460px; overflow:auto; border-radius:8px;
       font-family:monospace; font-size:13px; }
.dim { font-size:12px; color:#888; }
.apistatus { margin:-10px 0 18px; font-size:12px; color:#888; }
.apistatus b { display:inline-block; padding:2px 8px; margin-right:6px;
               border-radius:4px; border:1px solid #444; font-weight:normal; color:#888; }
.apistatus b.up   { color:#7c7; border-color:#3a5a3a; }
.apistatus b.warn { color:#fc6; border-color:#a86; }
.apistatus b.down { color:#e66; border-color:#a55; }
.actrow { display:flex; gap:18px; flex-wrap:wrap; margin-bottom:8px; }
label.act { display:inline-flex; align-items:center; gap:6px;
            background:#1b1b1b; border:1px solid #333; border-radius:6px;
            padding:8px 10px; cursor:pointer; font-size:14px; }
.aid { color:#9cf; font-family:monospace; }
.chip { display:inline-block; min-width:64px; text-align:center; font-size:11px;
        border-radius:4px; padding:1px 4px; border:1px solid #444; color:#888; }
.chip.pending { color:#fc6; border-color:#a86; animation:blink 1s infinite; }
.chip.ok      { color:#7c7; border-color:#3a5a3a; }
.chip.ko      { color:#e66; border-color:#a55; }
@keyframes blink { 50% { opacity:.35; } }
</style>
</head>

<body>

<div class="panel">

<h1>Metriques</h1>

<nav>
  <a href="index.html">Accueil</a>
  <a href="cle.html">Cle</a>
  <a href="commandes.html">Commandes</a>
  <a href="metriques.html" class="here">Metriques</a>
  <a href="telecommande.html">Telecommande</a>
  <a href="infos.html">Infos</a>
</nav>

<div class="apistatus" id="apistatus">ports :
  <b id="as8000">8000 test...</b>
  <b id="as8080">8080 api...</b>
  <b id="as8081">8081 gui...</b>
</div>

<div class="actrow">
  <label class="act"><input type="checkbox" id="cb-N5" checked>
    <span class="aid">[N5]</span> VITALS <span class="chip" id="chip-N5"></span></label>
  <label class="act"><input type="checkbox" id="cb-N6" checked>
    <span class="aid">[N6]</span> CHECK STATE <span class="chip" id="chip-N6"></span></label>
  <label class="act"><input type="checkbox" id="cb-C1">
    <span class="aid">[C1]</span> CONF CHECK <span class="chip" id="chip-C1"></span></label>
</div>

<button onclick="launchSelected()">&#9654; LANCER LA SELECTION</button>
<span class="dim"> max parallele :
<select id="maxth">
  <option>1</option><option>2</option><option>3</option><option>4</option>
</select>
| listeners box :
<select id="maxconn">
  <option>1</option><option selected>3</option><option>4</option>
  <option>5</option><option>6</option><option>7</option><option>2</option>
</select>
<button onclick="saveMaxConn()" style="padding:6px 10px;font-size:12px">APPLIQUER</button>
| depart decale + retries auto ; puce par action : ⏳ / ✓ / ✗</span><br><br>
<button onclick="loadVitals()">[N5] seul</button>
<button onclick="askState()">[N6] seul</button>
<button onclick="confCheck()">[C1] seul</button>
<span class="dim"> releves ecrits dans log/ sur la cle</span>

<h2>Releve</h2>
<div id="out">Chargement des signes vitaux...</div>

</div>

<script>

var API = "http://" + location.hostname + ":8080/api/";

function tokUrl(base) {
    var t = "";
    try { t = localStorage.getItem("rk_token") || ""; } catch (e) {}
    if (!t) return base;
    return base + (base.indexOf("?") < 0 ? "?" : "&") + "token=" + encodeURIComponent(t);
}

function api(path, noRetry) {
    var opts = {cache: "no-store"};
    if (typeof AbortController === "function") {
        var ac = new AbortController();
        setTimeout(function () { ac.abort(); }, 20000);
        opts.signal = ac.signal;
    }
    return fetch(tokUrl(API + path), opts).then(function(r) {
        if (r.status === 403) {
            var t = prompt("API protegee par un token (server/token sur la cle).\nEntrer la valeur du token :");
            if (t && t.trim()) {
                try { localStorage.setItem("rk_token", t.trim()); } catch (e) {}
                location.reload();
                throw new Error("token memorise, rechargement...");
            }
            throw new Error("403 forbidden (token requis)");
        }
        return r.text();
    }).catch(function(e) {
        if (e && e.message && e.message.indexOf("403") === 0) throw e;
        if (!noRetry) {
            return new Promise(function(res) {
                setTimeout(function() { res(api(path, true)); }, 1500);
            });
        }
        var cause = (e && e.message) ? e.message : "" + e;
        if (e && e.name === "AbortError") cause = "delai de 20 s depasse";
        throw new Error("API 8080 injoignable (" + cause + ") - lancer deploy EXPOSE sur la box");
    });
}

function show(t) {
    var d = new Date();
    function p(n) { return (n < 10 ? "0" : "") + n; }
    var stamp = p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds());
    document.getElementById("out").textContent = "[" + stamp + "] " + t;
}

function loadVitals() {
    fetch("/log/vitals_last.txt", {cache:"no-store"})
        .then(r => r.ok ? r.text() : Promise.reject())
        .then(t => show("VITALS\n" + t))
        .catch(() => show("(aucun releve vitals - cliquer VITALS puis recharger dans ~5 s)"));
}

function askState() {
    show("CHECK STATE lance...");
    api("STATE").catch(e => show("Erreur : " + e));
    var tries = 0;
    (function poll() {
        fetch("/log/state_last.txt", {cache:"no-store"})
            .then(r => { if (!r.ok) throw 0; return r.text(); })
            .then(t => {
                var head = t.slice(0, 40);
                if (askState.stamp && head === askState.stamp && tries < 8) {
                    setTimeout(poll, 2000); return;
                }
                askState.stamp = head;
                show("CHECK STATE\n" + t);
            })
            .catch(() => { if (tries++ < 8) setTimeout(poll, 2000); else show("etat indisponible"); });
    })();
}

function confCheck() {
    show("CONF CHECK...");
    api("CONF_CHECK")
        .then(t => show("CONF CHECK\n" + t))
        .catch(e => show("Erreur : " + e));
}

function saveMaxConn() {
    var v = document.getElementById("maxconn").value;
    api("MAXCONN?v=" + v)
        .then(t => show("[MAXCONN] " + t))
        .catch(e => show("[MAXCONN] Erreur : " + e));
}

/* ---- mode parallele : selection + pool avec max de threads ---- */

var ACTIONS = {
    N5: { run: function () {
        return api("VITALS").then(function (t) { return t; });
    } },
    N6: { run: function () {
        return new Promise(function (done) {
            var stamp0 = "";
            fetch("/log/state_last.txt", {cache:"no-store"})
                .then(r => r.ok ? r.text() : "")
                .then(t => { stamp0 = t.slice(0, 40); })
                .catch(() => {});
            var tries = 0;
            (function poll() {
                api("STATE").catch(function () {});
                setTimeout(function () {
                    fetch("/log/state_last.txt", {cache:"no-store"})
                        .then(r => { if (!r.ok) throw 0; return r.text(); })
                        .then(t => {
                            if (t.slice(0, 40) === stamp0 && tries < 8) {
                                tries++; setTimeout(poll, 2000); return;
                            }
                            done(t);
                        })
                        .catch(() => {
                            if (tries++ < 8) { setTimeout(poll, 2000); }
                            else { done("(etat indisponible)"); }
                        });
                }, tries === 0 ? 1500 : 2000);
            })();
        });
    } },
    C1: { run: function () {
        return api("CONF_CHECK");
    } }
};

function setChip(id, cls, txt) {
    var c = document.getElementById("chip-" + id);
    if (c) { c.className = "chip " + cls; c.textContent = txt; }
}

function appendOut(id, status, txt) {
    var d = new Date();
    function p(n) { return (n < 10 ? "0" : "") + n; }
    var stamp = p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds());
    var box = document.getElementById("out");
    box.textContent += "\n\n========== [" + id + "] " + status +
                       " - " + stamp + " ==========\n" + txt;
    box.scrollTop = box.scrollHeight;
}

function getChecked() {
    return Object.keys(ACTIONS).filter(function (id) {
        var cb = document.getElementById("cb-" + id);
        return cb && cb.checked;
    });
}

function launchSelected() {
    var ids = getChecked();
    if (!ids.length) { show("aucune action cochee"); return; }
    var max = parseInt(document.getElementById("maxth").value, 10) || 1;
    var queue = ids.slice(), active = 0;

    ids.forEach(function (id) { setChip(id, "pending", "EN COURS"); });
    show("lancement de " + ids.length + " action(s), max parallele = " + max);

    return new Promise(function (finished) {
        (function pump() {
            if (!queue.length && active === 0) { finished(); return; }
            while (active < max && queue.length) {
                (function (id) {
                    active++;
                    ACTIONS[id].run()
                        .then(function (txt) {
                            appendOut(id, "OK", txt);
                            setChip(id, "ok", "OK");
                        })
                        .catch(function (e) {
                            appendOut(id, "ECHEC", String(e));
                            setChip(id, "ko", "ECHEC");
                        })
                        .then(function () {
                            active--;
                            setTimeout(pump, 300);   /* depart decale */
                        });
                })(queue.shift());
            }
        })();
    });
}

loadVitals();

var AS_TOK = "";
try { AS_TOK = localStorage.getItem("rk_token") || ""; } catch (e) {}
function asUrl(b) {
    if (!AS_TOK) return b;
    return b + (b.indexOf("?") < 0 ? "?" : "&") + "token=" + encodeURIComponent(AS_TOK);
}
function asSet(id, cls, t) {
    var e = document.getElementById(id);
    if (e) { e.className = cls; e.textContent = t; }
}
asSet("as8000", "up", "8000 HTTP OK");
fetch(asUrl("http://" + location.hostname + ":8080/api/HELP"), {cache:"no-store"})
    .then(function (r) {
        asSet("as8080", r.status === 403 ? "warn" : "up",
              r.status === 403 ? "8080 API UP - token requis" : "8080 API OK");
    })
    .catch(function () {
        asSet("as8080", "down", "8080 API INJOIGNABLE (arrete ou bloque)");
    });
fetch(asUrl("http://" + location.hostname + ":8081/"), {cache:"no-store"})
    .then(function (r) {
        asSet("as8081", r.status === 403 ? "warn" : "up",
              r.status === 403 ? "8081 GUI UP - token requis" : "8081 GUI OK");
    })
    .catch(function () {
        asSet("as8081", "down", "8081 GUI INJOIGNABLE (arrete ou bloque)");
    });

</script>

</body>
</html>
